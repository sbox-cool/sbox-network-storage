name: Release status

# Publishes release-status.json (schema 1) to the release-status branch for the
# self-hosted server's owner dashboard. Built by .github/scripts/release-status.mjs
# from GitHub data only. Every run commits a new snapshot, because generatedAt
# and daysBehind change every hour even when no PR merged.

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-status
  cancel-in-progress: false

jobs:
  build:
    name: Build release-status.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test .github/scripts/release-status.test.mjs

      - name: Build release-status.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-status.mjs --out "$RUNNER_TEMP/release-status.json"

      - name: Upload status
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-status
          path: ${{ runner.temp }}/release-status.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release-status branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download status
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-status
          path: ${{ runner.temp }}/status

      - name: Commit to release-status
        env:
          STATUS_FILE: ${{ runner.temp }}/status/release-status.json
        run: |
          set -euo pipefail
          readme="$RUNNER_TEMP/release-status-README.md"
          cat > "$readme" <<'EOF'
          # release-status

          Generated by `.github/workflows/release-status.yml` in
          sbox-cool/sbox-network-storage (script `.github/scripts/release-status.mjs`).
          Do not edit by hand. Each run replaces `release-status.json` (schema 1)
          with a fresh snapshot; this branch's history is only those snapshots.

          The self-hosted server's owner dashboard reads the JSON from
          https://raw.githubusercontent.com/sbox-cool/sbox-network-storage/release-status/release-status.json
          EOF
          generated="$(jq -r '.generatedAt' "$STATUS_FILE")"
          if git ls-remote --exit-code --heads origin release-status >/dev/null 2>&1; then
            git fetch --depth=1 origin release-status
            git checkout -q -B release-status FETCH_HEAD
          else
            git checkout -q --orphan release-status
          fi
          git rm -r -q --ignore-unmatch .
          cp "$STATUS_FILE" release-status.json
          cp "$readme" README.md
          git add release-status.json README.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Release status ${generated}"
          git push origin HEAD:refs/heads/release-status
