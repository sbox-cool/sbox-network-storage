name: Compat gate

# Library-side compatibility gate. Holds library PRs that break the public API
# without approval, runs the real s&box dedicated server against the server's
# latest release and main, and blocks Code/ or Editor/ changes until an
# editor-tested label is applied. Everything is summarized by the single
# required check "Compat gate". See docs/compat-gate.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      library_ref:
        description: Library ref to test (branch, tag or SHA). Defaults to the dispatched ref.
        required: false
        type: string
      server_ref:
        description: Server ref to test (sbox-cool/sbox-network-storage-server). Empty uses SERVER_REF (env at the top of this file).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: compat-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVER_REPO: sbox-cool/sbox-network-storage-server
  # Server ref for the source-built leg and run.cs (server PR #97 merged into main).
  SERVER_REF: main
  SBOXNS_REPO: sbox-cool/sboxns.com
  # sboxns.com tools/compatibility/ContractInspector (pinned; Microsoft.CodeAnalysis.CSharp 4.14.0).
  SBOXNS_REF: ca71493c0617e675a99bfbcdbd0251c6fb86e7c9
  SBOXPUBLIC_REPO: Facepunch/sbox-public

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.classify.outputs.engine }}
      library_code: ${{ steps.classify.outputs.library_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "library_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mb=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only "$mb" "$HEAD_SHA" > changed.txt
          cat changed.txt
          engine=false
          code=false
          if grep -qE '^(Code|Editor|Assets)/|\.sbproj$|^\.github/workflows/compat-gate\.yml$' changed.txt; then
            engine=true
          fi
          if grep -qE '^(Code|Editor)/' changed.txt; then
            code=true
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "library_code=$code" >> "$GITHUB_OUTPUT"

  api-surface:
    name: API surface
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout ContractInspector (pinned sboxns.com)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SBOXNS_REPO }}
          ref: ${{ env.SBOXNS_REF }}
          path: .compat-tools/sboxns
          sparse-checkout: tools/compatibility/ContractInspector
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build ContractInspector
        run: |
          set -euo pipefail
          dotnet build "$GITHUB_WORKSPACE/.compat-tools/sboxns/tools/compatibility/ContractInspector" \
            -c Release -o "$RUNNER_TEMP/inspector" --nologo
          dotnet "$RUNNER_TEMP/inspector/ContractInspector.dll" --self-test

      - name: Extract base tree (merge-base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mb=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge-base: $mb"
          rm -rf "$RUNNER_TEMP/base"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$mb" | tar -x -C "$RUNNER_TEMP/base"

      - name: Diff public API surface
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/api"
          mkdir -p "$out"
          inspector=0
          dotnet "$RUNNER_TEMP/inspector/ContractInspector.dll" \
            --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE" \
            --output "$out/api.json" || inspector=$?

          if [ ! -f "$out/api.json" ]; then
            echo "::error::ContractInspector produced no output (exit $inspector)"
            exit 1
          fi

          removed=$(jq '.removed | length' "$out/api.json")
          added=$(jq '.added | length' "$out/api.json")
          body_changed=$(jq '.bodyChanged | length' "$out/api.json")
          errors=$(jq '.errors | length' "$out/api.json")

          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          approved=false
          if grep -qxF 'compat: breaking-approved' <<<"$labels"; then approved=true; fi

          result=pass
          reason="No public API removed or changed."
          if [ "$inspector" -ne 0 ] || [ "$errors" -gt 0 ]; then
            result=fail
            reason="ContractInspector reported $errors parse error(s); see the errors list. Fix them before the API can be checked."
          elif [ "$removed" -gt 0 ] && [ "$approved" != "true" ]; then
            result=fail
            reason="$removed public symbol(s) removed or changed without the compat: breaking-approved label. Keep the old form (see docs/compatibility-certification.md) or get the label approved."
          elif [ "$removed" -gt 0 ]; then
            result=pass
            reason="$removed public symbol(s) removed or changed; allowed by compat: breaking-approved."
            echo "::warning::$reason"
          fi

          {
            echo "## Public API surface"
            echo
            echo "Head \`${HEAD_SHA:0:12}\` vs merge-base of \`${BASE_SHA:0:12}\`. Scope: \`Code/\` and \`Editor/\`."
            echo
            echo "**Result: $result.** $reason"
            echo
            echo "Removed or changed: $removed. Added: $added. Meaningful changed files: $body_changed. Parse errors: $errors."
            echo
            jq -r '
              def clean: tostring | gsub("`"; "'"'"'") | gsub("\\|"; "\\|") | gsub("\n"; " ");
              (.added | map(.symbol)) as $addedSyms
              | if (.removed | length) == 0 then empty else
                "### Removed or changed (" + (.removed | length | tostring) + ")\n",
                "| Kind | Symbol | Signature | Location |",
                "|---|---|---|---|",
                (.removed[] | "| " + (if (.symbol as $s | $addedSyms | index($s)) != null then "changed" else "removed" end)
                  + " | `" + (.symbol | clean) + "` | `" + (.signature | clean) + "` | " + (.file | clean) + ":" + (.line | tostring) + " |"),
                ""
                end
            ' "$out/api.json"
            jq -r '
              def clean: tostring | gsub("`"; "'"'"'") | gsub("\\|"; "\\|") | gsub("\n"; " ");
              if (.added | length) == 0 then empty else
                "<details><summary>Added (" + (.added | length | tostring) + ")</summary>\n",
                (.added[] | "- `" + (.symbol | clean) + "` (" + (.file | clean) + ":" + (.line | tostring) + ")"),
                "\n</details>",
                ""
                end
            ' "$out/api.json"
            if [ "$errors" -gt 0 ]; then
              echo "### Parse errors ($errors)"
              echo
              jq -r '.errors[] | "- `" + (gsub("`"; "'"'"'") | gsub("\n"; " ")) + "`"' "$out/api.json"
              echo
            fi
            if [ "$body_changed" -gt 0 ]; then
              echo "<details><summary>Meaningful changed files ($body_changed)</summary>"
              echo
              jq -r '.bodyChanged[] | "- `" + (.file | gsub("`"; "'"'"'")) + "`"' "$out/api.json"
              echo
              echo "</details>"
            fi
          } > "$out/summary.md"

          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != "pass" ]; then
            echo "::error::$reason"
            exit 1
          fi

      - name: Upload API diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surface
          path: ${{ runner.temp }}/api
          if-no-files-found: warn
          retention-days: 14

  api-comment:
    name: API surface comment
    needs: api-surface
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.api-surface.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download API diff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-surface
          path: api-artifact

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- compat-gate:api-surface -->'
          body="$RUNNER_TEMP/comment.md"
          { echo "$marker"; cat api-artifact/summary.md; } > "$body"
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
          fi

  editor-evidence:
    name: Editor evidence
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require editor-tested for Code/ or Editor/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LIBRARY_CODE: ${{ needs.changes.outputs.library_code }}
        run: |
          set -euo pipefail
          if [ "$LIBRARY_CODE" != "true" ]; then
            echo "No changes under Code/ or Editor/: no s&box editor run required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if grep -qxF 'editor-tested' <<<"$labels"; then
            echo "Code/ or Editor/ changed; editor-tested label present. Evidence accepted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -qxF 'pending-sbox-editor-test' <<<"$labels"; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label pending-sbox-editor-test \
              || echo "::warning::Could not add pending-sbox-editor-test (read-only token, e.g. fork PR). Add it manually."
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Editor evidence required

          This PR changes `Code/` or `Editor/`. Wire or library behavior needs a real s&box editor run
          before merge. Hosted runners cannot run the editor, so this check stays red until a maintainer
          records the run.

          1. In `sbox-cool/sbox-network-storage-server`, run `tools/sbox-cli-e2e` on a Windows PC with Steam
             against this PR's library checkout (`--library <path>`), following `docs/editor-test-plan.md`.
          2. Record one `tested` row in `compat/library-matrix.json` in that repo, with the five facts.
          3. Apply the `editor-tested` label to this PR. The Compat gate re-runs automatically.
          EOF
          echo "::error::Code/ or Editor/ changed without the editor-tested label. See the job summary."
          exit 1

  engine:
    name: Engine (server ${{ matrix.server }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        server: [latest-release, main]
    permissions:
      contents: read
    steps:
      - name: Checkout library under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.library_ref || github.event.pull_request.head.sha || github.sha }}
          path: library
          persist-credentials: false

      - name: Checkout server (run.cs and main build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ inputs.server_ref || env.SERVER_REF }}
          path: server
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json

      - name: Download latest server release (verified)
        if: matrix.server == 'latest-release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'server-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download --repo $env:SERVER_REPO --pattern '*-win-x64.zip' --pattern SHA256SUMS --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
          $zips = @(Get-ChildItem -Path $dir -Filter '*-win-x64.zip')
          if ($zips.Count -ne 1) { throw "expected one win-x64 zip, found $($zips.Count)" }
          $zip = $zips[0]
          $line = Get-Content (Join-Path $dir 'SHA256SUMS') | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($zip.Name) + '$') } | Select-Object -First 1
          if (-not $line) { throw "$($zip.Name) not listed in SHA256SUMS" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch for $($zip.Name): $actual vs $expected" }
          Write-Host "Verified $($zip.Name) sha256 $actual"
          $unpacked = Join-Path $dir 'unpacked'
          Expand-Archive -Path $zip.FullName -DestinationPath $unpacked -Force
          $exe = Join-Path $unpacked 'sbox-ns.exe'
          if (-not (Test-Path $exe)) { throw "sbox-ns.exe missing from $($zip.Name)" }
          "SERVER_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build s&box dedicated engine (Facepunch/sbox-public)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:RUNNER_TEMP 'sbox-public'
          git clone --filter=blob:none "https://github.com/$env:SBOXPUBLIC_REPO.git" $engine
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }
          Push-Location $engine
          & .\Setup.bat
          if ($LASTEXITCODE -ne 0) { throw "Setup.bat failed ($LASTEXITCODE)" }
          Pop-Location
          "ENGINE=$engine/game" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run dedicated e2e against library under test
        shell: pwsh
        working-directory: server
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_LEG: ${{ matrix.server }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE "e2e-out/$env:SERVER_LEG"
          $library = Join-Path $env:GITHUB_WORKSPACE 'library'
          $cliArgs = @('--', '--engine', $env:ENGINE, '--targets', 'dedicated', '--library', $library, '--startup-timeout', '600', '--out', $out)
          if ($env:SERVER_LEG -eq 'latest-release') {
            $cliArgs += @('--server-binary', $env:SERVER_BINARY)
          }
          dotnet run tools/sbox-cli-e2e/run.cs @cliArgs
          if ($LASTEXITCODE -ne 0) { throw "sbox-cli-e2e failed ($LASTEXITCODE)" }

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $summaries = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'e2e-out') -Recurse -Filter 'summary.md' -ErrorAction SilentlyContinue
          foreach ($s in $summaries) { Get-Content $s.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.server }}
          path: e2e-out
          if-no-files-found: warn
          retention-days: 30

  engine-published:
    name: Engine (published revision)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Resolve newest published library revision
        id: rev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^r[0-9]+$' | sed 's/^r//' | sort -n | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "::notice::The library has no r<revision> release yet; published-revision leg skipped."
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=r$tag" >> "$GITHUB_OUTPUT"
            echo "Published library revision: r$tag"
          fi

      - name: Checkout server (run.cs and main build)
        if: steps.rev.outputs.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ inputs.server_ref || env.SERVER_REF }}
          path: server
          persist-credentials: false

      - name: Set up .NET
        if: steps.rev.outputs.ref != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json

      - name: Download latest server release (verified)
        if: steps.rev.outputs.ref != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'server-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download --repo $env:SERVER_REPO --pattern '*-win-x64.zip' --pattern SHA256SUMS --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
          $zips = @(Get-ChildItem -Path $dir -Filter '*-win-x64.zip')
          if ($zips.Count -ne 1) { throw "expected one win-x64 zip, found $($zips.Count)" }
          $zip = $zips[0]
          $line = Get-Content (Join-Path $dir 'SHA256SUMS') | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($zip.Name) + '$') } | Select-Object -First 1
          if (-not $line) { throw "$($zip.Name) not listed in SHA256SUMS" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch for $($zip.Name): $actual vs $expected" }
          Write-Host "Verified $($zip.Name) sha256 $actual"
          $unpacked = Join-Path $dir 'unpacked'
          Expand-Archive -Path $zip.FullName -DestinationPath $unpacked -Force
          $exe = Join-Path $unpacked 'sbox-ns.exe'
          if (-not (Test-Path $exe)) { throw "sbox-ns.exe missing from $($zip.Name)" }
          "SERVER_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build s&box dedicated engine (Facepunch/sbox-public)
        if: steps.rev.outputs.ref != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:RUNNER_TEMP 'sbox-public'
          git clone --filter=blob:none "https://github.com/$env:SBOXPUBLIC_REPO.git" $engine
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }
          Push-Location $engine
          & .\Setup.bat
          if ($LASTEXITCODE -ne 0) { throw "Setup.bat failed ($LASTEXITCODE)" }
          Pop-Location
          "ENGINE=$engine/game" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run dedicated e2e against published revision
        if: steps.rev.outputs.ref != ''
        shell: pwsh
        working-directory: server
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIBRARY_REF: ${{ steps.rev.outputs.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'e2e-out/published'
          $cliArgs = @('--', '--engine', $env:ENGINE, '--targets', 'dedicated', '--library', $env:LIBRARY_REF, '--server-binary', $env:SERVER_BINARY, '--startup-timeout', '600', '--out', $out)
          dotnet run tools/sbox-cli-e2e/run.cs @cliArgs
          if ($LASTEXITCODE -ne 0) { throw "sbox-cli-e2e failed ($LASTEXITCODE)" }

      - name: Job summary
        if: always() && steps.rev.outputs.ref != ''
        shell: pwsh
        run: |
          $summaries = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'e2e-out') -Recurse -Filter 'summary.md' -ErrorAction SilentlyContinue
          foreach ($s in $summaries) { Get-Content $s.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload e2e output
        if: always() && steps.rev.outputs.ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-published
          path: e2e-out
          if-no-files-found: warn
          retention-days: 30

  nightly-issue:
    name: Nightly failure issue
    needs: [engine, engine-published]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule') &&
      (needs.engine.result == 'failure' || needs.engine-published.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update one issue per failing leg
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          server_tag=$(gh release view --repo "$SERVER_REPO" --json tagName --jq '.tagName')
          rev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^r[0-9]+$' | sed 's/^r//' | sort -n | tail -n 1 || true)

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' > failed.txt
          cat failed.txt

          while IFS= read -r job; do
            case "$job" in
              "Engine (server latest-release)") title="Nightly compat failure: library main x server $server_tag" ;;
              "Engine (server main)") title="Nightly compat failure: library main x server main" ;;
              "Engine (published revision)") title="Nightly compat failure: library r$rev x server $server_tag" ;;
              *) continue ;;
            esac
            body=$(printf '%s\n' \
              "Compat gate leg **$job** failed." \
              "" \
              "- Library commit: \`$COMMIT\`" \
              "- Server release: \`$server_tag\`" \
              "- Run: $RUN_URL" \
              "" \
              "The failing run's e2e output is in the \`engine-*\` artifacts of that run.")
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label compat --state open --limit 200 \
              --json number,title | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1 || true)
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --label compat --title "$title" --body "$body"
            fi
          done < failed.txt

  compat-gate:
    name: Compat gate
    if: always()
    needs: [changes, api-surface, api-comment, editor-evidence, engine, engine-published, nightly-issue]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "::error::Compat gate failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
