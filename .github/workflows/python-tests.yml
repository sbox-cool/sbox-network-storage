name: Python tests

# Runs the unittest suite for the Python sync tool (Editor/*.py) on every PR and on main.
# The sync tool depends on PyYAML for source parsing; the C# Sync Tool is covered by compat-gate.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pyyaml==6.0.3"

      - name: Run unittest suite
        run: python -m unittest discover -s Tests -p "test_*.py" -v
